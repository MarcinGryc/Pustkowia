name: Build and PostgreSQL integration
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pustkowia
          POSTGRES_PASSWORD: pustkowia
          POSTGRES_DB: pustkowia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pustkowia -d pustkowia_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://pustkowia:pustkowia@localhost:5432/pustkowia_test
          PYTHONPATH: backend
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pustkowia:pustkowia@localhost:5432/pustkowia_test
