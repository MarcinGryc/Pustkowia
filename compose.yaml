services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pustkowia
      POSTGRES_PASSWORD: pustkowia
      POSTGRES_DB: pustkowia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pustkowia -d pustkowia"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    profiles: [full]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pustkowia:pustkowia@db:5432/pustkowia
      APP_ORIGIN: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
